<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="Spider-Sense Network — most active repo and recent commit detection">
<rect width="1000" height="380" rx="16" fill="#081426" stroke="#17365C"/>
<g stroke="#EAF2FF" stroke-opacity="0.04" stroke-width="1" fill="none">
<line x1="0" y1="0" x2="500" y2="380"/><line x1="500" y1="0" x2="0" y2="380"/>
<circle cx="250" cy="190" r="150"/><circle cx="750" cy="190" r="150"/>
</g>

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.2s" fill="freeze"/>
    <text x="30" y="42" font-family="Impact,'Arial Black',sans-serif" font-size="22" letter-spacing="3" fill="#EAF2FF">SPIDER-SENSE NETWORK</text>
    <text x="330" y="44" font-family="'Cascadia Code',Consolas,monospace" font-size="11" letter-spacing="2" fill="#8B9BB4">// THREAT DETECTION ACTIVE</text>
    <circle cx="960" cy="34" r="4" fill="#2BD576"><animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="34" r="4" fill="none" stroke="#2BD576" stroke-width="1"><animate attributeName="r" values="4;12" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="2.2s" repeatCount="indefinite"/></circle>
    <text x="972" y="39" font-family="'Cascadia Code',Consolas,monospace" font-size="12" letter-spacing="2" fill="#2BD576">ONLINE</text>
    </g>
  

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.5s" fill="freeze"/>
    <rect x="40" y="70" width="460" height="140" rx="14" fill="#0B1728" stroke="#17365C"/>
    <rect x="40" y="70" width="460" height="3" fill="#E62429" fill-opacity="0.85"/>
    <circle cx="56" cy="90" r="3" fill="#E62429"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="70" y="96" font-family="'Cascadia Code',Consolas,monospace" font-size="10" letter-spacing="2" fill="#8B9BB4">MOST ACTIVE REPOSITORY</text>
    <text x="70" y="138" font-family="Impact,'Arial Black',sans-serif" font-size="24" letter-spacing="0.5" fill="#EAF2FF">spiderman-github-readme</text>
    <text x="70" y="168" font-family="'Cascadia Code',Consolas,monospace" font-size="10" letter-spacing="1" fill="#8B9BB4">DETECTED VIA STAR + COMMIT SIGNATURE</text>
    </g>
  

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.7s" fill="freeze"/>
    <rect x="520" y="70" width="460" height="140" rx="14" fill="#0B1728" stroke="#17365C"/>
    <rect x="520" y="70" width="460" height="3" fill="#1976D2" fill-opacity="0.85"/>
    <circle cx="536" cy="90" r="3" fill="#1976D2"><animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <text x="550" y="96" font-family="'Cascadia Code',Consolas,monospace" font-size="10" letter-spacing="2" fill="#8B9BB4">LAST COMMIT DETECTED</text>
    <text x="550" y="138" font-family="Impact,'Arial Black',sans-serif" font-size="24" letter-spacing="0.5" fill="#1976D2">Never</text>
    <text x="550" y="168" font-family="'Cascadia Code',Consolas,monospace" font-size="10" letter-spacing="1" fill="#8B9BB4">∞</text>
    </g>
  

    <g opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1s" fill="freeze"/>
    <defs>
      <radialGradient id="pulseGlow" cx="500" cy="280" r="180">
        <stop offset="0" stop-color="#E62429" stop-opacity="0.15"/>
        <stop offset="1" stop-color="#E62429" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect x="40" y="230" width="920" height="130" rx="14" fill="url(#pulseGlow)"/>
    <path d="M20,190 Q250,100 490,190 Q730,280 980,190" fill="none" stroke="#E62429" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="1000" stroke-dashoffset="1000">
      <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M20,190 Q250,100 490,190 Q730,280 980,190" fill="none" stroke="#FF3340" stroke-opacity="0.6" stroke-width="1">
      <animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="2s" repeatCount="indefinite"/>
    </path>
    <circle cx="500" cy="280" r="60" fill="none" stroke="#E62429" stroke-width="1.5" stroke-opacity="0.5">
      <animate attributeName="r" values="40;90" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="280" r="60" fill="none" stroke="#FF3340" stroke-width="1" stroke-opacity="0.3">
      <animate attributeName="r" values="20;80" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <text x="500" y="286" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-size="18" letter-spacing="3" fill="#E62429">TINGLING</text>
    <text x="500" y="312" text-anchor="middle" font-family="'Cascadia Code',Consolas,monospace" font-size="10" letter-spacing="2" fill="#8B9BB4">SPIDER-SENSE ACTIVE</text>
    </g>
  

    <text x="40" y="368" font-family="'Cascadia Code',Consolas,monospace" font-size="11" letter-spacing="3" fill="#8B9BB4">SENSITIVITY</text>
    <rect x="160" y="356" width="200" height="10" rx="5" fill="#0B1728" stroke="#17365C"/>
    <rect x="161" y="357" width="180" height="8" rx="4" fill="#E62429" fill-opacity="0.9"><animate attributeName="width" from="0" to="180" dur="1.5s" begin="1.8s" fill="freeze"/></rect>
    <text x="960" y="368" text-anchor="end" font-family="'Cascadia Code',Consolas,monospace" font-size="10" letter-spacing="2" fill="#8B9BB4">LIVE · SPIDER-SENSE NETWORK</text>
  
</svg>
