name: Refresh Profile, Nexus & Yellow Contribution Calendar

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'readme.config.json'
      - 'assets/og-image.jpg'
      - 'themes/**'
      - 'templates/**'
      - 'tools/**'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow for live ASCII portrait rendering
        run: pip install --quiet Pillow

      - name: Generate SVG assets & README
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python tools/generate.py --username "${{ github.repository_owner }}"

      - name: Commit and push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A README.md assets/
          if git diff --cached --quiet; then
            echo "No telemetry or visual changes to commit."
          else
            git commit -m "⚡ refresh Contribution Calendar, Nexus & language icons [skip ci]"
            git push
          fi
